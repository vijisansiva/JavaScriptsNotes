<html>
    <head><title>Element Of Html</title></head>
    <body>
        <center>
        <h1> Student Registration Form</h1>         </center>
        <h2>
        <!--TextBOx-->
         <Lable> Name :</Lable>
         <input type="text" id="name">
         <br>
         <!--radio Button-->
         <label>Gender : </label>
         <input type ="radio" name="gender" value="Male">
         Male
         <input type ="radio" name="gender" value="Female">
         Female
         <br>
         <br>

         <label> Skills:</label>
         <input type="checkbox" name="skill" value="python"> Python
         <input type="checkbox" name="skill" value="java">Java
         <input type="checkbox" name="skill" value="Java Scripts">JavaScript

         <input type="checkbox" name="skill" value="Playwright">Playwright
         <br>
         <br>

         <!--dropdown -->
         <label> Course</label>
         <select id="Course">
            <option value=" ">Select the Course</option>
            <option value="Python">Python</option>
            <option value="Java">Java</option>
            <option value="Java Scripts"> JavaScripts</option>
            <option value="Playwright">Playwright</option>
          
         </select>

<br>
<br>
<!--textarea-->
<label> Address:</label>
<br>
<textarea id="address" rows="3" cols="30"></textarea>
<button onclick="displaydata()">
    Submit
</button>
<h1> Student Details</h1>
<p id="result"></p>
</h2>
<script>
function displaydata()
{

//1.Get TextBox vaue
let name=document.getElementById("name").value;

//2.Get Radio Button Value
let genderElement=document.querySelector('input[Name="gender"]:checked');
let gender=genderElement? genderElement.value :"Not Selected";
//Get  CheckBox Values
let checkboxElements=document.querySelectorAll('input[name="skill"]:checked');

let skills=[];
checkboxElements.forEach(function(skill){
    skills.push(skill.value);

});

//4.Get the Textarea value 
let address=document.getElementById("address").value;

//5.Get Dropdown value
let course=getElementById("course").value;

//6.Display all value
document.getElementById("result").innerHTML=


"Name :" +name +"<br>"+
"Gender :"+gender +"<br>"+
"Skills :" +skills.join(",") +"<br>"+
"Course :" +course +"<br>"+
"Address:"  +address;

}6
</script>
                
    </body>
</html>
